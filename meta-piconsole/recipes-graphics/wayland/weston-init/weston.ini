[core]
require-input=false
idle-time=0

[shell]
background-color=0xff000000
background-type=solid-color
panel-position=none
locking=false

[output]
name=HDMI-A-1
mode=1920x1080@60

[output]
name=HDMI-A-2
mode=1920x1080@60

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize