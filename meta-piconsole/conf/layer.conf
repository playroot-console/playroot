# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-piconsole"
BBFILE_PATTERN_meta-piconsole = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-piconsole = "6"

LAYERDEPENDS_meta-piconsole = "core"
LAYERSERIES_COMPAT_meta-piconsole = "scarthgap"
